<div class="otp-input">
    @for (digit of digits; track $index) {
    <input #otpInput type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" [value]="digit"
        [attr.aria-label]="'Chiffre ' + ($index + 1)" (input)="onInput($event, $index)"
        (keydown)="onKeydown($event, $index)" (paste)="onPaste($event)" />
    }
</div>
