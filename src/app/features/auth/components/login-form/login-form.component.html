<div class="login-form">
    <div class="login-form__heading">
        <h2>Content de vous revoir.</h2>
        <p>Connectez-vous pour retrouver votre espace alimentaire.</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="login-form__field">
            <label for="email">Adresse e-mail</label>
            <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="vous@exemple.fr"
                autocomplete="email" required />
        </div>

        <div class="login-form__field">
            <label for="password">Mot de passe</label>
            <app-password-field name="password" [(ngModel)]="password" autocomplete="current-password"
                placeholder="Votre mot de passe" required />
        </div>

        <div class="login-form__options">
            <label>
                <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe" />
                Se souvenir de moi
            </label>

            <a routerLink="/mot-de-passe-oublie">
                Mot de passe oublié ?
            </a>
        </div>

        @if (errorMessage) {
        <p class="register-form__message register-form__message--error" role="alert">
            {{ errorMessage }}
        </p>
        }

        @if (successMessage) {
        <output class="register-form__message register-form__message--success">
            {{ successMessage }}
        </output>
        }

        <button class="button button--primary" type="submit" [disabled]="loginForm.invalid || isSubmitting">
            {{ isSubmitting ? 'Connexion…' : 'Se connecter' }}
        </button>
    </form>

    <p class="login-form__register">
        Vous n'avez pas encore de compte ?
        <a routerLink="/inscription">Créer un compte</a>
    </p>
</div>
