<div class="storages-page">
    <section class="storages-page__heading">
        <div>
            <h1>Mes stockages</h1>
            <p>Gérez les différents emplacements de conservation de vos aliments.</p>
        </div>

        <div class="storages-page__actions">
            <button class="storages-page__add storages-page__add--fridge" type="button">
                <span aria-hidden="true">+</span>
                Ajouter un frigo
            </button>

            <button class="storages-page__add storages-page__add--cupboard" type="button">
                <span aria-hidden="true">+</span>
                Ajouter un placard
            </button>
        </div>
    </section>

    <section class="storages-page__content">
        <div class="storages-page__empty">
            <h2>Aucun stockage pour le moment</h2>
            <p>
                Créez votre premier frigo ou placard pour organiser vos aliments.
            </p>
        </div>
    </section>
</div>
