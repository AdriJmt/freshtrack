<app-modal
  [title]="storage()?.id ? 'Modifier le stockage' : 'Créer un stockage'"
  [description]="
    type() === 'FRIDGE'
      ? 'Un espace frais pour vos aliments.'
      : 'Un espace pour vos produits à température ambiante.'
  "
  [busy]="saving()"
  (closed)="cancel.emit()"
>
  <form (ngSubmit)="submit()">
    <label for="storage-name">Nom du stockage</label>
    <input
      id="storage-name"
      name="storageName"
      type="text"
      placeholder="Ex. : Frigo de la cuisine"
      maxlength="80"
      required
      [disabled]="saving()"
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
    />
    @if (errorMessage()) {
      <p class="error" role="alert">{{ errorMessage() }}</p>
    }
    <footer class="modal-footer">
      <button type="button" [disabled]="saving()" (click)="cancel.emit()">
        Annuler
      </button>
      <button
        class="primary"
        type="submit"
        [disabled]="!name().trim() || saving()"
      >
        {{ saving() ? 'Enregistrement…' : 'Enregistrer' }}
      </button>
    </footer>
  </form>
</app-modal>
