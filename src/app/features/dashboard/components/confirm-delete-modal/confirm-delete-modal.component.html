<app-modal [title]="title()" [busy]="deleting()" (closed)="cancel.emit()">
  <p>
    Voulez-vous supprimer <strong>{{ itemName() }}</strong> ?
  </p>
  <p class="muted">{{ description() }}</p>
  @if (errorMessage()) {
    <p class="error" role="alert">{{ errorMessage() }}</p>
  }
  <footer class="modal-footer">
    <button type="button" [disabled]="deleting()" (click)="cancel.emit()">
      Annuler
    </button>
    <button
      class="danger"
      type="button"
      [disabled]="deleting()"
      (click)="confirm.emit()"
    >
      {{ deleting() ? 'Suppression…' : 'Supprimer' }}
    </button>
  </footer>
</app-modal>
