<app-modal
  [title]="
    currentMode() === 'manual'
      ? 'Ajouter des produits'
      : currentMode() === 'scan'
        ? 'Ajouter par scan'
        : 'Comment souhaitez-vous ajouter vos produits ?'
  "
  [wide]="currentMode() === 'manual'"
  [busy]="isSaving()"
  (closed)="closeScan()"
>
  @if (currentMode() === 'manual') {
    <app-manual-product-form
      [storages]="storages()"
      [initialStorageId]="initialStorageId()"
      [saving]="isSaving()"
      (save)="onSave($event)"
      (cancel)="backToModes()"
    />
  } @else if (currentMode() === 'scan') {
    @if (useCamera()) {
      <app-scan-flow
        [showHeader]="false"
        [storages]="storages()"
        [initialStorageId]="initialStorageId()"
        (productsAdded)="onScannedProductAdded()"
        (cancel)="closeScan()"
      />
    } @else {
      <p class="intro">
        Ouvrez le scan sur votre téléphone, sans vous reconnecter.
      </p>
      <app-qr-scan-panel (productsAdded)="onScannedProductAdded()" />
      <footer class="modal-footer">
        <button type="button" (click)="backToModes()">Retour</button
        ><button type="button" class="primary" (click)="startLocalScan()">
          Scanner ici
        </button>
      </footer>
    }
  } @else {
    <div class="options">
      <button type="button" class="option" (click)="onSelectMode('scan')">
        <span class="icon" aria-hidden="true">▥</span
        ><span
          ><strong>Scanner un produit</strong
          ><small>Code-barres et date, avec votre téléphone.</small></span
        ><span aria-hidden="true">→</span>
      </button>
      <button type="button" class="option" (click)="onSelectMode('manual')">
        <span class="icon" aria-hidden="true">＋</span
        ><span
          ><strong>Saisir les informations</strong
          ><small>Ajoutez un ou plusieurs produits manuellement.</small></span
        ><span aria-hidden="true">→</span>
      </button>
    </div>
  }
  @if (errorMessage()) {
    <p class="error" role="alert">{{ errorMessage() }}</p>
  }
</app-modal>
