<app-modal
  title="Modifier le produit"
  [wide]="true"
  [busy]="saving()"
  (closed)="cancel.emit()"
>
  <app-manual-product-form
    [storages]="storages()"
    [initialProduct]="formProduct()"
    [saving]="saving()"
    (save)="save.emit($event)"
    (cancel)="cancel.emit()"
  />
  @if (errorMessage()) {
    <p class="form-error" role="alert">{{ errorMessage() }}</p>
  }
</app-modal>
