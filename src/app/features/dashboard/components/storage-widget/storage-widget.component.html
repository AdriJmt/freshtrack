<section>
  <div class="workspace__section">
    <div>
      <h2>Vos stockages</h2>
      <p>Ouvrez un espace pour voir son contenu.</p>
    </div>
    <a routerLink="/stockages">Tout voir →</a>
  </div>
  <div class="storage-list">
    @for (storage of storages(); track storage.id) {
      <app-storage-card
        [storage]="storage"
        [summary]="summaries().get(storage.id!)"
        (edit)="editStorage.emit($event)"
        (delete)="deleteStorage.emit($event)"
      />
    }
    <button
      class="storage-add"
      type="button"
      (click)="addStorage.emit('FRIDGE')"
    >
      ＋ Créer un stockage
    </button>
  </div>
</section>
