<div class="password-field">
    <svg class="password-field__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="4" y="10" width="16" height="11" rx="2.5" stroke="currentColor" stroke-width="1.6" />
        <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        <circle cx="12" cy="15" r="1.2" fill="currentColor" />
    </svg>

    <input class="password-field__input" [type]="visible() ? 'text' : 'password'" [value]="value()"
        [placeholder]="placeholder()" [autocomplete]="autocomplete()" [disabled]="disabled()"
        (input)="updateValue($any($event.target).value)" (blur)="markAsTouched()" aria-label="Mot de passe" />

    <button class="password-field__toggle" type="button" (click)="toggleVisibility()" [disabled]="disabled()"
        [attr.aria-label]="
      visible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'
    " [attr.aria-pressed]="visible()">
        @if (visible()) {
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" />
            <path
                d="M9.9 5.2A10.7 10.7 0 0 1 12 5c5.5 0 9 7 9 7a16 16 0 0 1-3.1 3.8M6.2 6.2C4.1 7.7 3 12 3 12s3.5 7 9 7c1.1 0 2.1-.2 3-.6"
                stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
        } @else {
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 12s3.5-7 9-7 9 7 9 7-3.5 7-9 7-9-7-9-7Z" stroke="currentColor" stroke-width="1.7" />
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7" />
        </svg>
        }
    </button>
</div>
