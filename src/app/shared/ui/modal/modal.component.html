<dialog
  #dialog
  class="modal"
  [class.modal--wide]="wide()"
  [attr.aria-label]="title()"
  [attr.aria-busy]="busy()"
  (cancel)="close($event)"
  (click)="backdrop($event)"
>
  <header class="modal__header">
    <div>
      <h2>{{ title() }}</h2>
      @if (description()) {
        <p>{{ description() }}</p>
      }
    </div>
    <button
      type="button"
      aria-label="Fermer la fenêtre"
      [disabled]="busy()"
      (click)="close()"
    >
      &times;
    </button>
  </header>
  <div class="modal__body"><ng-content /></div>
</dialog>
